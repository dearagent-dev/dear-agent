[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "herald"
version = "0.0.1"
description = "Async, email-first inbox that turns messages into Git pull requests produced by coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Herald contributors" }]
keywords = ["agents", "email", "queue", "git", "automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
herald = "herald.cli.main:main"
herald-http = "herald.http:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
