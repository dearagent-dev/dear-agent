# Self-hosted Renovate: opens PRs that keep Python and GitHub Actions dependencies current.
#
# Requires a `RENOVATE_TOKEN` repository secret: a fine-grained PAT (or a GitHub App token)
# with `contents: write` and `pull_requests: write`. The default `GITHUB_TOKEN` is not used
# because PRs it creates cannot trigger CI, and Renovate PRs must run CI before landing.
name: Renovate

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [debug, info, warn]
      repoCache:
        description: Repository cache
        default: enabled
        type: choice
        options: [enabled, disabled, reset]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}
