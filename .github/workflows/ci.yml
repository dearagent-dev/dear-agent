name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: herald
          POSTGRES_PASSWORD: herald
          POSTGRES_DB: herald
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herald"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HERALD_TEST_DATABASE_URL: postgresql://herald:herald@localhost:5432/herald
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff format --check . && ruff check .

      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the real UBI 9 image so Dockerfile/dependency regressions are caught in CI
      # (the deployable artifact must install psycopg[bin] and run the CLI).
      - name: Build the container image
        run: docker build -t herald:ci .

      - name: Smoke-check the image
        run: docker run --rm herald:ci herald --help
