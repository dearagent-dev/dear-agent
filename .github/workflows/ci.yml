name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: herald
          POSTGRES_PASSWORD: herald
          POSTGRES_DB: herald
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herald"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      greenmail:
        image: greenmail/standalone:latest
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
            -Dgreenmail.users=green:pwd@example.com
        ports:
          - 3025:3025
          - 3143:3143
    env:
      HERALD_TEST_DATABASE_URL: postgresql://herald:herald@localhost:5432/herald
      HERALD_TEST_IMAP_HOST: 127.0.0.1
      HERALD_TEST_IMAP_PORT: "3143"
      HERALD_TEST_SMTP_PORT: "3025"
      HERALD_TEST_IMAP_USER: green
      HERALD_TEST_IMAP_PASSWORD: pwd
      HERALD_TEST_IMAP_TO: green@example.com
      HERALD_TEST_IMAP_SSL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff format --check . && ruff check .

      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the real UBI 9 image so Containerfile/dependency regressions are caught in CI
      # (the deployable artifact must install psycopg[bin] and run the CLI). Buildah uses the
      # Containerfile natively; no docker.
      - name: Build the container image
        uses: redhat-actions/buildah-build@v3
        with:
          image: herald
          tags: ci
          containerfiles: ./Containerfile

      - name: Smoke-check the image
        run: podman run --rm herald:ci herald --help
