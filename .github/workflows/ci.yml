name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: dear-agent
          POSTGRES_PASSWORD: dear-agent
          POSTGRES_DB: dear-agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dear-agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      greenmail:
        image: greenmail/standalone@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
            -Dgreenmail.users=green:pwd@example.com
        ports:
          - 3025:3025
          - 3143:3143
    env:
      DEAR_AGENT_TEST_DATABASE_URL: postgresql://dear-agent:dear-agent@localhost:5432/dear-agent
      DEAR_AGENT_TEST_IMAP_HOST: 127.0.0.1
      DEAR_AGENT_TEST_IMAP_PORT: "3143"
      DEAR_AGENT_TEST_SMTP_PORT: "3025"
      DEAR_AGENT_TEST_IMAP_USER: green
      DEAR_AGENT_TEST_IMAP_PASSWORD: pwd
      DEAR_AGENT_TEST_IMAP_TO: green@example.com
      DEAR_AGENT_TEST_IMAP_SSL: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff format --check . && ruff check .

      - name: Test
        run: pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fail the build if a credential is committed (TruffleHog OSS, no license needed).
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the real UBI 9 image so Containerfile/dependency regressions are caught in CI
      # (the deployable artifact must install psycopg[bin] and run the CLI). Buildah uses the
      # Containerfile natively; no docker.
      - name: Build the container image
        uses: redhat-actions/buildah-build@v3
        with:
          image: dear-agent
          tags: ci
          containerfiles: ./Containerfile

      - name: Smoke-check the image
        run: podman run --rm dear-agent:ci dear-agent --help

      # The harness image (ADR 0007) is built FROM the just-built image and bundles the harness
      # through its own loader. Build it so a broken Containerfile or shim fails CI, then check
      # both the CLI and the bundled-harness entrypoint.
      - name: Build the harness image
        uses: redhat-actions/buildah-build@v3
        with:
          image: dear-agent-harness
          tags: ci
          context: ./deploy/harness
          containerfiles: ./deploy/harness/Containerfile
          build-args: DEAR_AGENT_IMAGE=dear-agent:ci

      - name: Smoke-check the harness image
        run: |
          podman run --rm --entrypoint dear-agent dear-agent-harness:ci harness-serve --help >/dev/null
          podman run --rm --entrypoint sh dear-agent-harness:ci -c 'HOME=/tmp opencode --version'
