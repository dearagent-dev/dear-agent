# Control plane: the HTTP endpoint that receives normalized inbound events and runs the
# inbound loop. Stateless; all durable state is in the mailbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: herald-control-plane
  labels:
    app.kubernetes.io/name: herald
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: herald
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herald
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: herald-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/OWNER/herald:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "herald.cli.main"]
          args: ["--help"]
          envFrom:
            - configMapRef:
                name: herald-config
          env:
            - name: FASTMAIL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: herald-jmap
                  key: FASTMAIL_API_TOKEN
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: herald-control-plane
spec:
  selector:
    app.kubernetes.io/name: herald
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
