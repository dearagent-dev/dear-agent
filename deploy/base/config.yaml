# Shared configuration. Secrets are referenced, never inlined (see ADR 0003).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dear-agent-config
data:
  DEAR_AGENT_QUEUE: "postgres"
  DEAR_AGENT_BACKEND: "jmap"
  DEAR_AGENT_MAILBOX: "Dear Agent"
  DEAR_AGENT_WORKTREES_ROOT: "/work"
  DEAR_AGENT_MODEL: "local:model"
  # The runner/harness images the dispatcher injects into the runner Job template (placeholders
  # __RUNNER_IMAGE__ / __HARNESS_IMAGE__); the overlays set the environment tag.
  DEAR_AGENT_RUNNER_IMAGE: "quay.io/dear-agent/dear-agent:latest"
  DEAR_AGENT_HARNESS_IMAGE: "quay.io/dear-agent/dear-agent:harness-latest"
  DEAR_AGENT_GIT_HOST: "github.com"
  # The two-container runner is the default: the harness container holds the model credential
  # only, never the DB/git/forge credentials (ADR 0007). Set this to dear-agent-runner-template
  # for the single-container runner.
  DEAR_AGENT_RUNNER_TEMPLATE_CONFIGMAP: "dear-agent-runner-sidecar-template"
  DEAR_AGENT_MAX_BODY_BYTES: "1048576"
  DEAR_AGENT_HTTP_TIMEOUT: "15"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dear-agent-control-plane
automountServiceAccountToken: false
---
# The runner only needs to read repositories and call the model.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dear-agent-runner
automountServiceAccountToken: false
---
# The push/PR step needs write access, so it gets its own identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dear-agent-publisher
automountServiceAccountToken: false
