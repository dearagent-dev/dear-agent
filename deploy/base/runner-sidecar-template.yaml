# OPT-IN two-container runner (ADR 0007): the untrusted harness runs in its own container
# with no credential, so a compromised run cannot read the DB DSN or the git key.
#
# Enable it by pointing the scheduler at this template:
#   DEAR_AGENT_RUNNER_TEMPLATE_CONFIGMAP=dear-agent-runner-sidecar-template
#
# The `harness` container image bundles the harness (OpenCode today) on top of the control-plane
# image: see deploy/harness/Containerfile, published as quay.io/dear-agent/harness. Set its tag
# here to match the control-plane image (`:dev`, `:stable`, …): kustomize's `images:` cannot
# rewrite a value inside this ConfigMap's `job.yaml`, so it is pinned below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dear-agent-runner-sidecar-template
  labels:
    app.kubernetes.io/name: dear-agent
    app.kubernetes.io/part-of: dear-agent
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: dear-agent-task-placeholder
      labels:
        app.kubernetes.io/name: dear-agent
        app.kubernetes.io/component: runner
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dear-agent
            app.kubernetes.io/component: runner
        spec:
          restartPolicy: Never
          serviceAccountName: dear-agent-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            # Control: holds the DB DSN and the git key, and does clone/push/PR.
            - name: control
              image: quay.io/dear-agent/dear-agent:latest
              command: ["dear-agent"]
              args:
                - "run"
                - "--repo"
                - "/work/source"
                - "--model"
                - "$(DEAR_AGENT_MODEL)"
                - "$(DEAR_AGENT_TASK_ID)"
              envFrom:
                - configMapRef:
                    name: dear-agent-config
                # The forge token (GH_TOKEN/GITLAB_TOKEN/GITEA_TOKEN) for the API PR (ADR 0009).
                - secretRef:
                    name: dear-agent-forge
                    optional: true
              env:
                - name: DEAR_AGENT_TASK_ID
                  value: ""
                - name: DEAR_AGENT_MODEL
                  value: ""
                - name: DEAR_AGENT_HARNESS_DIR
                  value: "/work/harness"
                - name: DEAR_AGENT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dear-agent-postgres
                      key: DATABASE_URL
                      optional: true
                - name: GIT_SSH_COMMAND
                  value: "ssh -i /run/secrets/git/ssh-privatekey -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
                # The clone uses the read key above; the push uses this write key (ADR 0003).
                - name: DEAR_AGENT_GIT_PUSH_KEY
                  value: "/run/secrets/git-push/ssh-privatekey"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: harness
                  mountPath: /work/harness
                - name: git-read
                  mountPath: /run/secrets/git
                  readOnly: true
                - name: git-push
                  mountPath: /run/secrets/git-push
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
            # Harness: no DB DSN, no git key, no transport credential. Its own container is
            # the jail; it only sees the shared worktree.
            - name: harness
              image: quay.io/dear-agent/harness:latest
              command: ["dear-agent"]
              args: ["harness-serve", "--dir", "/work/harness", "--once"]
              envFrom:
                - configMapRef:
                    name: dear-agent-config
                # The harness's own model credential — and only that (ADR 0007).
                - secretRef:
                    name: dear-agent-model
                    optional: true
              env:
                - name: DEAR_AGENT_HARNESS_DIR
                  value: "/work/harness"
                - name: DEAR_AGENT_HARNESS
                  value: "opencode"
                - name: DEAR_AGENT_HARNESS_ENV
                  value: "OPENCODE_CONFIG_CONTENT"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: harness
                  mountPath: /work/harness
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: work
              emptyDir: {}
            - name: harness
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: git-read
              secret:
                secretName: dear-agent-git-read
                optional: true
                defaultMode: 0400
            - name: git-push
              secret:
                secretName: dear-agent-git-push
                optional: true
                defaultMode: 0400
