# Permissions for the scheduler/control plane: read the runner template and create one
# runner Job per queued task. Nothing here can read Secrets or touch workloads it did not
# create (see docs/security.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dear-agent-dispatcher
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dear-agent-runner-template", "dear-agent-runner-sidecar-template"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dear-agent-dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dear-agent-dispatcher
subjects:
  - kind: ServiceAccount
    name: dear-agent-control-plane
