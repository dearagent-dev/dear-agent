# One Job per task. The runner claims a task in the mailbox, clones into an emptyDir,
# runs the harness under the sandbox, and publishes a draft PR. Jobs have no time ceiling
# (unlike FaaS), which is the whole reason the runner is not serverless.
apiVersion: batch/v1
kind: Job
metadata:
  name: herald-task
  labels:
    app.kubernetes.io/name: herald
    app.kubernetes.io/component: runner
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herald
        app.kubernetes.io/component: runner
    spec:
      restartPolicy: Never
      serviceAccountName: herald-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/OWNER/herald:latest
          command: ["python", "-m", "herald.cli.main", "task", "--backend", "jmap", "claim"]
          args: ["$(HERALD_TASK_ID)"]
          envFrom:
            - configMapRef:
                name: herald-config
          env:
            - name: HERALD_TASK_ID
              value: ""
            - name: FASTMAIL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: herald-jmap
                  key: FASTMAIL_API_TOKEN
            - name: GIT_SSH_COMMAND
              value: "ssh -i /run/secrets/git/ssh-privatekey -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: git-read
              mountPath: /run/secrets/git
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: git-read
          secret:
            secretName: herald-git-read
            defaultMode: 0400
