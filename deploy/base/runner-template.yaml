# The runner Job template. A Job is immutable and one-per-task, so it cannot be applied
# statically; the scheduler reads this template, gives the Job a deterministic name from the
# task id, and creates it. Deterministic naming makes dispatch idempotent: a re-run (or the
# next CronJob tick) hits AlreadyExists instead of creating a second Job for the same task.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dear-agent-runner-template
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: dear-agent-task-placeholder
      labels:
        app.kubernetes.io/name: dear-agent
        app.kubernetes.io/component: runner
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dear-agent
            app.kubernetes.io/component: runner
        spec:
          restartPolicy: Never
          serviceAccountName: dear-agent-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: quay.io/rarguello/dear-agent:latest
              command: ["dear-agent"]
              # The runner claims a persisted task and runs the harness; it needs no mailbox
              # (the spec lives on the task row) and sends no mail without --recipient, so it
              # carries no mail credential. The transport defaults to memory. To notify from
              # the runner, add --recipient and --backend jmap and mount dear-agent-jmap.
              args:
                - "run"
                - "--repo"
                - "/work/source"
                - "--model"
                - "$(DEAR_AGENT_MODEL)"
                - "$(DEAR_AGENT_TASK_ID)"
              envFrom:
                - configMapRef:
                    name: dear-agent-config
              env:
                - name: DEAR_AGENT_TASK_ID
                  value: ""
                - name: DEAR_AGENT_MODEL
                  value: ""
                - name: DEAR_AGENT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dear-agent-postgres
                      key: DATABASE_URL
                      optional: true
                - name: GIT_SSH_COMMAND
                  value: "ssh -i /run/secrets/git/ssh-privatekey -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: git-read
                  mountPath: /run/secrets/git
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: git-read
              secret:
                secretName: dear-agent-git-read
                optional: true
                defaultMode: 0400
