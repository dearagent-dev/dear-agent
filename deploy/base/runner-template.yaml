# The runner Job template. A Job is immutable and one-per-task, so it cannot be applied
# statically; the scheduler reads this template, gives the Job a deterministic name from the
# task id, and creates it. Deterministic naming makes dispatch idempotent: a re-run (or the
# next CronJob tick) hits AlreadyExists instead of creating a second Job for the same task.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dear-agent-runner-template
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: dear-agent-task-placeholder
      labels:
        app.kubernetes.io/name: dear-agent
        app.kubernetes.io/component: runner
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dear-agent
            app.kubernetes.io/component: runner
            app.kubernetes.io/part-of: dear-agent
        spec:
          restartPolicy: Never
          serviceAccountName: dear-agent-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: __RUNNER_IMAGE__
              imagePullPolicy: Always
              command: ["dear-agent"]
              # The runner claims a persisted task and runs the harness; the spec lives on the
              # task row. It notifies the recipient only when DEAR_AGENT_RUNNER_BACKEND is a real
              # transport (jmap) and DEAR_AGENT_RECIPIENT is set; the default backend is memory, so
              # it sends no mail and needs no mail credential.
              args:
                - "run"
                - "--repo"
                - "/work/source"
                - "--model"
                - "$(DEAR_AGENT_MODEL)"
                - "--backend"
                - "$(DEAR_AGENT_RUNNER_BACKEND)"
                - "--recipient"
                - "$(DEAR_AGENT_RECIPIENT)"
                - "$(DEAR_AGENT_TASK_ID)"
              envFrom:
                - configMapRef:
                    name: dear-agent-config
                # The forge token (GH_TOKEN/GITLAB_TOKEN/GITEA_TOKEN) for the API PR (ADR 0009).
                - secretRef:
                    name: dear-agent-forge
                    optional: true
                # The harness model credential; OpenCode reads OPENCODE_CONFIG_CONTENT.
                - secretRef:
                    name: dear-agent-model
                    optional: true
                # Outbound status/approval mail, only needed when the runner backend is jmap.
                - secretRef:
                    name: dear-agent-jmap
                    optional: true
              env:
                - name: DEAR_AGENT_TASK_ID
                  value: ""
                - name: DEAR_AGENT_MODEL
                  value: ""
                - name: DEAR_AGENT_HARNESS_ENV
                  value: "OPENCODE_CONFIG_CONTENT"
                - name: DEAR_AGENT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dear-agent-postgres
                      key: DATABASE_URL
                      optional: true
                - name: GIT_SSH_COMMAND
                  value: "ssh -i /run/secrets/git/ssh-privatekey -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
                # The clone uses the read key above; the push uses this write key (ADR 0003).
                - name: DEAR_AGENT_GIT_PUSH_KEY
                  value: "/run/secrets/git-push/ssh-privatekey"
                # HTTPS remotes use the forge token as a credential (deploy keys are not always
                # available); SSH remotes still use the keys above.
                - name: GIT_CONFIG_COUNT
                  value: "1"
                - name: GIT_CONFIG_KEY_0
                  value: "credential.helper"
                - name: GIT_CONFIG_VALUE_0
                  value: "!f() { echo username=x-access-token; echo password=${GH_TOKEN}; }; f"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: git-read
                  mountPath: /run/secrets/git
                  readOnly: true
                - name: git-push
                  mountPath: /run/secrets/git-push
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: git-read
              secret:
                secretName: dear-agent-git-read
                optional: true
                defaultMode: 0400
            - name: git-push
              secret:
                secretName: dear-agent-git-push
                optional: true
                defaultMode: 0400
