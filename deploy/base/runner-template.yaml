# The runner Job template. A Job is immutable and one-per-task, so it cannot be applied
# statically; the scheduler reads this template and creates one Job per claimed task with
# the task id substituted. Keeping it in a ConfigMap makes the intent explicit and lets
# the sweep render it without a controller.
apiVersion: v1
kind: ConfigMap
metadata:
  name: herald-runner-template
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: herald-task-
      labels:
        app.kubernetes.io/name: herald
        app.kubernetes.io/component: runner
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: herald
            app.kubernetes.io/component: runner
        spec:
          restartPolicy: Never
          serviceAccountName: herald-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: ghcr.io/OWNER/herald:latest
              command: ["herald"]
              args:
                - "run"
                - "--backend"
                - "jmap"
                - "--repo"
                - "/repos/source"
                - "--recipient"
                - "$(HERALD_RECIPIENT)"
                - "--model"
                - "$(HERALD_MODEL)"
                - "$(HERALD_TASK_ID)"
              envFrom:
                - configMapRef:
                    name: herald-config
              env:
                - name: HERALD_TASK_ID
                  value: ""
                - name: HERALD_RECIPIENT
                  value: ""
                - name: HERALD_MODEL
                  value: ""
                - name: FASTMAIL_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: herald-jmap
                      key: FASTMAIL_API_TOKEN
                      optional: true
                - name: GIT_SSH_COMMAND
                  value: "ssh -i /run/secrets/git/ssh-privatekey -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: git-read
                  mountPath: /run/secrets/git
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: git-read
              secret:
                secretName: herald-git-read
                optional: true
                defaultMode: 0400
