# Secret manifests with NO values: provide the data out of band (sealed secret,
# External Secrets Operator, or `oc create secret`). See docs/decisions/0003-credentials.md.
#
#   herald-git-read   ssh-privatekey  read-only deploy key
#   herald-git-push   ssh-privatekey  write deploy key (herald/* only)
#   herald-jmap       FASTMAIL_API_TOKEN
#   herald-inbound    HERALD_INBOUND_SECRET  HMAC secret for the inbound webhook
#   herald-model      provider api key
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-git-read
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-git-push
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-jmap
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-inbound
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-model
type: Opaque
stringData: {}
