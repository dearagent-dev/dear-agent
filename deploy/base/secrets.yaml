# Reference for the Secrets Herald needs. This file is NOT part of the kustomize build
# (see kustomization.yaml): applying secret objects from git can reset a live credential,
# so provision them out of band with `oc create secret`, External Secrets Operator or
# SealedSecrets. See docs/decisions/0003-credentials.md.
#
#   herald-git-read   ssh-privatekey        read-only deploy key
#   herald-git-push   ssh-privatekey        write deploy key (herald/* only)
#   herald-jmap       FASTMAIL_API_TOKEN
#   herald-inbound    HERALD_INBOUND_SECRET HMAC secret for the inbound webhook
#   herald-model      provider api key
#
# Example:
#   oc -n herald create secret generic herald-jmap \
#     --from-literal=FASTMAIL_API_TOKEN=... --dry-run=client -o yaml | oc apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-git-read
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-git-push
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-jmap
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-inbound
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: herald-model
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
