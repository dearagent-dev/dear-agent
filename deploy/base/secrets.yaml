# Reference for the Secrets Dear Agent needs. This file is NOT part of the kustomize build
# (see kustomization.yaml): applying secret objects from git can reset a live credential,
# so provision them out of band with `oc create secret`, External Secrets Operator or
# SealedSecrets. See docs/decisions/0003-credentials.md.
#
#   dear-agent-git-read   ssh-privatekey        read-only deploy key
#   dear-agent-git-push   ssh-privatekey        write deploy key (dear-agent/* only)
#   dear-agent-jmap       FASTMAIL_API_TOKEN
#   dear-agent-inbound    DEAR_AGENT_INBOUND_SECRET HMAC secret for the inbound webhook
#   dear-agent-model      provider api key
#   dear-agent-postgres   POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE,
#                     POSTGRESQL_ADMIN_PASSWORD  (consumed by the StatefulSet)
#                     DATABASE_URL               (the app's DEAR_AGENT_DATABASE_URL DSN)
#
# Example:
#   oc -n dear-agent create secret generic dear-agent-jmap \
#     --from-literal=FASTMAIL_API_TOKEN=... --dry-run=client -o yaml | oc apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-git-read
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-git-push
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-jmap
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-inbound
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-model
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: dear-agent-postgres
# No data/stringData here on purpose: applying this manifest must never reset a value
# that was provisioned out of band. Create the keys with `oc create secret` / ESO / SealedSecrets.
# Keys: POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE, POSTGRESQL_ADMIN_PASSWORD,
# DATABASE_URL (e.g. postgresql://dear-agent:<password>@dear-agent-postgres:5432/dear-agent).
type: Opaque
