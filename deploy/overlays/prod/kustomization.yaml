apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dear-agent
resources:
  - ../../base
components:
  - ../../components/postgresql
  - ../../components/egress
images:
  - name: quay.io/dear-agent/dear-agent
    newTag: stable
patches:
  - target:
      kind: Deployment
      name: dear-agent-control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # Pin a storage class for the database if the cluster default is not what you want:
