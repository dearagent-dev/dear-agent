apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: herald
resources:
  - ../../base
components:
  - ../../components/postgresql
images:
  - name: quay.io/rarguello/herald
    newTag: stable
patches:
  - target:
      kind: Deployment
      name: herald-control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # Pin a storage class for the database if the cluster default is not what you want:
  # - target:
  #     kind: StatefulSet
  #     name: herald-postgres
  #   patch: |-
  #     - op: add
  #       path: /spec/volumeClaimTemplates/0/spec/storageClassName
  #       value: <storage-class>
