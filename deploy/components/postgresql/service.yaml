# Headless Service governing the dear-agent-postgres StatefulSet. Clients connect to
# `dear-agent-postgres:5432`; the name is never exposed outside the cluster (no Route/NodePort).
apiVersion: v1
kind: Service
metadata:
  name: dear-agent-postgres
  labels:
    app.kubernetes.io/name: dear-agent-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dear-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dear-agent-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
