# Egress allowlist for runner Jobs (the only pods that run a harness).
#
# Included by default. NetworkPolicy cannot match hostnames, so the default allows DNS,
# same-namespace (Postgres) and everything else **except link-local** — which makes the cloud
# metadata endpoint (169.254.169.254) unreachable, a common exfiltration/SSRF target — while a
# hosted model and github.com keep working. Tighten it to your model/Git CIDRs or an in-cluster
# egress proxy (see the commented block): the default is a floor, not the finished policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dear-agent-runner-egress
  labels:
    app.kubernetes.io/name: dear-agent
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: dear-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL and anything else in this namespace.
    - to:
        - podSelector: {}
    # Everything else, except link-local / cloud metadata.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
    # Tighten to the model endpoint and Git host (or an in-cluster egress proxy) and drop the
    # catch-all above:
    # - to:
    #     - ipBlock:
    #         cidr: 198.51.100.0/24   # model endpoint
    #     - ipBlock:
    #         cidr: 140.82.112.0/20    # github.com
    #   ports:
    #     - protocol: TCP
    #       port: 443
